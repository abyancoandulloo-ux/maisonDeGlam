<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison De Glam · Admin Dashboard</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        /* Same styles as before, omitted for brevity */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0d0d;
            color: #faf6f2;
            padding: 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .gold {
            color: #d4af7a;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 0.04em;
        }
        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.04em;
            margin-bottom: 1rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .form-section {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            backdrop-filter: blur(8px);
        }
        .form-section h2 {
            margin-bottom: 1rem;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
            margin-bottom: 0.8rem;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 0.2rem;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #d4af7a;
            background: rgba(255, 255, 255, 0.06);
        }
        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }
        .form-group .full-width {
            flex: 100%;
        }

        .file-upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            color: rgba(255, 255, 255, 0.4);
        }
        .file-upload-area:hover {
            border-color: #d4af7a;
            background: rgba(212, 175, 122, 0.04);
        }
        .file-upload-area input {
            display: none;
        }

        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .image-preview img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af7a, #b8945a);
            color: #0f0d0d;
            border: none;
            padding: 0.6rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover {
            transform: scale(1.04);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-danger {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.25);
        }

        .form-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .product-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 1rem;
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }
        .product-card:hover {
            border-color: rgba(212, 175, 122, 0.2);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
        }
        .product-card .brand {
            color: #d4af7a;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .product-card .name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .product-card .price {
            color: #d4af7a;
            font-weight: 600;
        }
        .product-card .stock {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            display: inline-block;
            margin-top: 0.3rem;
        }
        .stock.in-stock {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        .stock.out-of-stock {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }
        .card-actions button {
            font-size: 0.75rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 13, 13, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 122, 0.15);
            padding: 0.8rem 1.8rem;
            border-radius: 40px;
            color: #fff;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 3000;
        }
        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            .form-group {
                min-width: 100%;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== TOP BAR ===== -->
        <div class="top-bar">
            <h1>Maison <span class="gold">De</span> Glam <span style="font-size: 0.8rem; font-weight: 300; color: rgba(255,255,255,0.3);">Admin</span></h1>
            <button class="btn-secondary" onclick="fetchProducts()"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>

        <!-- ===== FORM SECTION ===== -->
        <div class="form-section">
            <h2 id="formTitle">Add New Product</h2>
            <input type="hidden" id="editId" value="" />

            <div class="form-row">
                <div class="form-group">
                    <label>Brand *</label>
                    <input type="text" id="brand" placeholder="e.g. HUDA BEAUTY" />
                </div>
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="name" placeholder="e.g. Easy Blur" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Size (e.g. 30ml)</label>
                    <input type="text" id="size" placeholder="30ml" />
                </div>
                <div class="form-group">
                    <label>Price (MUR) *</label>
                    <input type="number" id="price" step="0.01" placeholder="2500" />
                </div>
                <div class="form-group">
                    <label>In Stock</label>
                    <select id="inStock">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Promo (e.g. On sale till 31 Aug)</label>
                    <input type="text" id="promo" placeholder="On promo till 31 August" />
                </div>
                <div class="form-group">
                    <label>Shades (comma separated)</label>
                    <input type="text" id="shades" placeholder="Linen, Porcelaine, Chantily" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex:100%;">
                    <label>Description</label>
                    <textarea id="description" placeholder="Product description..."></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex:100%;">
                    <label>Product Images</label>
                    <div class="file-upload-area" id="uploadArea">
                        <i class="fa-regular fa-image" style="font-size: 1.5rem; display: block; margin-bottom: 0.3rem;"></i>
                        Click to upload images
                        <input type="file" id="fileInput" accept="image/*" multiple />
                    </div>
                    <div id="imagePreviewContainer" class="image-preview"></div>
                    <small style="color: rgba(255,255,255,0.3);">Images stored in Supabase Storage.</small>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn-primary" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> Save Product</button>
                <button class="btn-secondary" id="clearBtn"><i class="fa-solid fa-eraser"></i> Clear Form</button>
            </div>
        </div>

        <!-- ===== PRODUCT GRID ===== -->
        <div id="productGrid" class="product-grid">
            <!-- Products loaded here -->
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <!-- =============================================================
    JAVASCRIPT
    ============================================================= -->
    <script>
        // ------------------------------------------------------------
        // SUPABASE CONFIG
        // ------------------------------------------------------------
        const SUPABASE_URL = 'https://zjfqatxxksjwxfptxouq.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_OxkzTlktWOXW0ZGIgGQ-Ug_cyuZOOEE';
        const BUCKET_NAME = 'glam';
        const TABLE_NAME = 'glam';

        // Create client
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ------------------------------------------------------------
        // STATE
        // ------------------------------------------------------------
        let currentImages = [];

        // ------------------------------------------------------------
        // DOM REFS
        // ------------------------------------------------------------
        const formTitle = document.getElementById('formTitle');
        const editId = document.getElementById('editId');
        const brand = document.getElementById('brand');
        const name = document.getElementById('name');
        const size = document.getElementById('size');
        const price = document.getElementById('price');
        const description = document.getElementById('description');
        const inStock = document.getElementById('inStock');
        const promo = document.getElementById('promo');
        const shades = document.getElementById('shades');
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreviewContainer');
        const productGrid = document.getElementById('productGrid');
        const saveBtn = document.getElementById('saveBtn');
        const clearBtn = document.getElementById('clearBtn');

        // ------------------------------------------------------------
        // CLEAR FORM
        // ------------------------------------------------------------
        function clearForm() {
            formTitle.textContent = 'Add New Product';
            editId.value = '';
            brand.value = '';
            name.value = '';
            size.value = '';
            price.value = '';
            description.value = '';
            inStock.value = 'true';
            promo.value = '';
            shades.value = '';
            imagePreview.innerHTML = '';
            currentImages = [];
            fileInput.value = '';
        }

        // ------------------------------------------------------------
        // FETCH PRODUCTS
        // ------------------------------------------------------------
        async function fetchProducts() {
            productGrid.innerHTML = '<p style="color: rgba(255,255,255,0.4);">Loading...</p>';

            const { data, error } = await supabaseClient
                .from(TABLE_NAME)
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                showToast('Error loading products');
                productGrid.innerHTML = '<p style="color: #f87171;">Failed to load products.</p>';
                return;
            }

            if (!data || data.length === 0) {
                productGrid.innerHTML = '<p style="color: rgba(255,255,255,0.3);">No products yet. Add your first product!</p>';
                return;
            }

            productGrid.innerHTML = data.map((p) => `
                <div class="product-card">
                    <div>
                        ${p.images && p.images.length > 0
                            ? `<img src="${p.images[0]}" alt="${p.name}" onerror="this.style.display='none'">`
                            : `<div style="height:180px; background:rgba(0,0,0,0.2); border-radius:8px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.2);"><i class="fa-regular fa-image" style="font-size:2rem;"></i></div>`
                        }
                    </div>
                    <div class="brand">${p.brand}</div>
                    <div class="name">${p.name} ${p.size ? '· ' + p.size : ''}</div>
                    <div class="price">Rs ${Number(p.price).toLocaleString()}</div>
                    <div class="stock ${p.in_stock ? 'in-stock' : 'out-of-stock'}">${p.in_stock ? 'In Stock' : 'Out of Stock'}</div>
                    ${p.promo ? `<div style="color:#fbbf24; font-size:0.75rem;">${p.promo}</div>` : ''}
                    <div class="card-actions">
                        <button class="btn-secondary" onclick="loadProductForEdit('${p.id}')"><i class="fa-regular fa-pen-to-square"></i> Edit</button>
                        <button class="btn-danger" onclick="deleteProduct('${p.id}')"><i class="fa-regular fa-trash-can"></i> Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // ------------------------------------------------------------
        // LOAD PRODUCT FOR EDIT
        // ------------------------------------------------------------
        function loadProductForEdit(id) {
            supabaseClient
                .from(TABLE_NAME)
                .select('*')
                .eq('id', id)
                .single()
                .then(({ data, error }) => {
                    if (error) {
                        showToast('Error loading product');
                        return;
                    }
                    if (!data) return;

                    formTitle.textContent = 'Edit Product';
                    editId.value = data.id;
                    brand.value = data.brand || '';
                    name.value = data.name || '';
                    size.value = data.size || '';
                    price.value = data.price || '';
                    description.value = data.description || '';
                    inStock.value = data.in_stock ? 'true' : 'false';
                    promo.value = data.promo || '';
                    shades.value = data.shades || '';

                    currentImages = data.images || [];
                    imagePreview.innerHTML = currentImages.map((url) => `
                        <img src="${url}" alt="product image" />
                    `).join('');

                    document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
                });
        }

        // ------------------------------------------------------------
        // IMAGE UPLOAD – FIXED VERSION WITH BETTER ERROR HANDLING
        // ------------------------------------------------------------
        async function handleFileSelect(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            // Show a loading indicator
            showToast('Uploading images...');

            for (const file of files) {
                try {
                    // 1. Show temporary thumbnail
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.opacity = '0.6';
                        img.dataset.uploading = 'true';
                        imagePreview.appendChild(img);
                    };
                    reader.readAsDataURL(file);

                    // 2. Upload to Supabase Storage
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}-${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
                    const filePath = `public/${fileName}`; // store in a subfolder for organization

                    console.log(`Uploading ${file.name} as ${filePath}...`);

                    const { data, error } = await supabaseClient.storage
                        .from(BUCKET_NAME)
                        .upload(filePath, file, {
                            cacheControl: '3600',
                            upsert: false,
                            contentType: file.type
                        });

                    if (error) {
                        console.error('Upload error:', error);
                        showToast(`Failed to upload ${file.name}: ${error.message}`);
                        // Remove the temporary thumbnail
                        const thumbs = imagePreview.querySelectorAll('img');
                        const lastThumb = thumbs[thumbs.length - 1];
                        if (lastThumb && lastThumb.dataset.uploading) {
                            lastThumb.remove();
                        }
                        continue;
                    }

                    console.log('Upload success:', data);

                    // 3. Get public URL
                    const { data: urlData } = supabaseClient.storage
                        .from(BUCKET_NAME)
                        .getPublicUrl(filePath);

                    const publicUrl = urlData.publicUrl;
                    currentImages.push(publicUrl);

                    // 4. Update thumbnail to full image
                    const thumbs = imagePreview.querySelectorAll('img');
                    const lastThumb = thumbs[thumbs.length - 1];
                    if (lastThumb && lastThumb.dataset.uploading) {
                        lastThumb.src = publicUrl;
                        lastThumb.style.opacity = '1';
                        delete lastThumb.dataset.uploading;
                    } else {
                        // fallback: add a new image
                        const img = document.createElement('img');
                        img.src = publicUrl;
                        imagePreview.appendChild(img);
                    }

                    showToast(`Uploaded ${file.name}`);
                } catch (err) {
                    console.error('Unexpected error:', err);
                    showToast(`Error uploading ${file.name}: ${err.message}`);
                }
            }

            fileInput.value = '';
            showToast('All uploads processed.');
        }

        // ------------------------------------------------------------
        // SAVE PRODUCT
        // ------------------------------------------------------------
        async function saveProduct() {
            const id = editId.value;
            const brandVal = brand.value.trim();
            const nameVal = name.value.trim();
            const sizeVal = size.value.trim();
            const priceVal = parseFloat(price.value);
            const descriptionVal = description.value.trim();
            const inStockVal = inStock.value === 'true';
            const promoVal = promo.value.trim();
            const shadesVal = shades.value.trim();

            if (!brandVal || !nameVal || isNaN(priceVal)) {
                showToast('Please fill in Brand, Name, and Price.');
                return;
            }

            const productData = {
                brand: brandVal,
                name: nameVal,
                size: sizeVal || null,
                price: priceVal,
                description: descriptionVal || null,
                in_stock: inStockVal,
                promo: promoVal || null,
                shades: shadesVal || null,
                images: currentImages,
                updated_at: new Date().toISOString()
            };

            let result;
            if (id) {
                result = await supabaseClient
                    .from(TABLE_NAME)
                    .update(productData)
                    .eq('id', id);
            } else {
                result = await supabaseClient
                    .from(TABLE_NAME)
                    .insert([productData]);
            }

            if (result.error) {
                console.error(result.error);
                showToast('Error saving product');
                return;
            }

            showToast(id ? 'Product updated!' : 'Product added!');
            clearForm();
            fetchProducts();
        }

        // ------------------------------------------------------------
        // DELETE PRODUCT
        // ------------------------------------------------------------
        async function deleteProduct(id) {
            if (!confirm('Delete this product permanently?')) return;

            const { error } = await supabaseClient
                .from(TABLE_NAME)
                .delete()
                .eq('id', id);

            if (error) {
                showToast('Error deleting product');
                return;
            }

            showToast('Product deleted');
            fetchProducts();
        }

        // ------------------------------------------------------------
        // TOAST
        // ------------------------------------------------------------
        let toastTimer;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ------------------------------------------------------------
        // EVENT BINDING
        // ------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', function() {
            saveBtn.addEventListener('click', saveProduct);
            clearBtn.addEventListener('click', clearForm);

            document.getElementById('uploadArea').addEventListener('click', function() {
                fileInput.click();
            });
            fileInput.addEventListener('change', handleFileSelect);

            fetchProducts();

            document.querySelectorAll('#brand, #name, #size, #price, #promo, #shades').forEach((field) => {
                field.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        saveProduct();
                    }
                });
            });

            console.log('Dashboard ready. Upload images by clicking the upload area.');
        });
    </script>

</body>
</html>
