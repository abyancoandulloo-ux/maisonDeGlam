<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison De Glam · Admin Dashboard</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- Supabase JS -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* === styles (same as before, omitted for brevity) === */
        /* ... (keep all the styles from the previous working version) ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0d0d;
            color: #faf6f2;
            padding: 1rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .gold {
            color: #d4af7a;
        }
        h1,
        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            letter-spacing: 0.04em;
        }
        h1 {
            font-size: 2.5rem;
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            gap: 1rem;
        }
        .actions-bar {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4af7a, #b8945a);
            color: #0f0d0d;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover {
            transform: scale(1.04);
        }
        .btn-danger {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.25);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .product-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 1rem;
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }
        .product-card:hover {
            border-color: rgba(212, 175, 122, 0.2);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
        }
        .product-card .brand {
            color: #d4af7a;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .product-card .name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .product-card .price {
            color: #d4af7a;
            font-weight: 600;
        }
        .product-card .stock {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            display: inline-block;
            margin-top: 0.3rem;
        }
        .stock.in-stock {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        .stock.out-of-stock {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }
        .card-actions button {
            font-size: 0.75rem;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-content {
            background: #1a1717;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 2rem;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            margin-bottom: 1.2rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 0.2rem;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #d4af7a;
            background: rgba(255, 255, 255, 0.06);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1;
            min-width: 120px;
        }
        .file-upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            color: rgba(255, 255, 255, 0.4);
        }
        .file-upload-area:hover {
            border-color: #d4af7a;
            background: rgba(212, 175, 122, 0.04);
        }
        .file-upload-area input {
            display: none;
        }
        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .image-preview img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 13, 13, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 122, 0.15);
            padding: 0.8rem 1.8rem;
            border-radius: 40px;
            color: #fff;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 3000;
        }
        .toast.show {
            opacity: 1;
        }
        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .modal-content {
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h1>Maison <span class="gold">De</span> Glam <span style="font-size: 0.8rem; font-weight: 300; color: rgba(255,255,255,0.3);">Admin</span></h1>
        </div>

        <div class="actions-bar">
            <button class="btn-primary" id="addProductBtn"><i class="fa-solid fa-plus"></i> Add Product</button>
            <button class="btn-secondary" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>

        <div id="productGrid" class="product-grid">
            <!-- Products loaded here -->
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Product</h2>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editId" value="" />

                <div class="form-group">
                    <label>Brand *</label>
                    <input type="text" id="brand" required placeholder="e.g. HUDA BEAUTY" />
                </div>
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="name" required placeholder="e.g. Easy Blur" />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Size (e.g. 30ml)</label>
                        <input type="text" id="size" placeholder="30ml" />
                    </div>
                    <div class="form-group">
                        <label>Price (MUR) *</label>
                        <input type="number" id="price" required step="0.01" placeholder="2500" />
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" placeholder="Product description..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>In Stock</label>
                        <select id="inStock">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Promo (e.g. On sale till 31 Aug)</label>
                        <input type="text" id="promo" placeholder="On promo till 31 August" />
                    </div>
                </div>
                <div class="form-group">
                    <label>Shades (comma separated)</label>
                    <input type="text" id="shades" placeholder="Linen, Porcelaine, Chantily" />
                </div>

                <div class="form-group">
                    <label>Product Images</label>
                    <div class="file-upload-area" onclick="document.getElementById('fileInput').click()">
                        <i class="fa-regular fa-image" style="font-size: 1.5rem; display: block; margin-bottom: 0.3rem;"></i>
                        Click to upload images
                        <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFileSelect(event)" />
                    </div>
                    <div id="imagePreviewContainer" class="image-preview"></div>
                    <small style="color: rgba(255,255,255,0.3);">Upload images; they will be stored in Supabase Storage.</small>
                </div>

                <div style="display: flex; gap: 0.8rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn-primary" style="flex:1;">Save Product</button>
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- ===== SINGLE SCRIPT BLOCK – NO DUPLICATES ===== -->
    <script>
        // =============================================================
        // CONFIGURATION
        // =============================================================
        const SUPABASE_URL = 'https://zjfqatxxksjwxfptxouq.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_OxkzTlktWOXW0ZGIgGQ-Ug_cyuZOOEE';
        const BUCKET_NAME = 'glam';
        const TABLE_NAME = 'glam';

        // Create supabase client only once
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =============================================================
        // STATE
        // =============================================================
        let currentImages = [];

        // =============================================================
        // GLOBAL FUNCTIONS (used in onclick attributes)
        // =============================================================
        window.openAddModal = function() {
            console.log('openAddModal called');
            const modal = document.getElementById('productModal');
            if (!modal) {
                console.error('Modal not found!');
                return;
            }
            document.getElementById('modalTitle').textContent = 'Add Product';
            document.getElementById('editId').value = '';
            document.getElementById('productForm').reset();
            document.getElementById('imagePreviewContainer').innerHTML = '';
            currentImages = [];
            modal.classList.add('open');
        };

        window.closeModal = function() {
            document.getElementById('productModal').classList.remove('open');
            document.getElementById('productForm').reset();
            document.getElementById('imagePreviewContainer').innerHTML = '';
            currentImages = [];
        };

        window.fetchProducts = async function() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '<p style="color: rgba(255,255,255,0.4);">Loading...</p>';

            const { data, error } = await supabase
                .from(TABLE_NAME)
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                window.showToast('Error loading products');
                grid.innerHTML = '<p style="color: #f87171;">Failed to load products.</p>';
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<p style="color: rgba(255,255,255,0.3);">No products yet. Add your first product!</p>';
                return;
            }

            grid.innerHTML = data.map((p) => `
                <div class="product-card">
                    <div>
                        ${p.images && p.images.length > 0
                            ? `<img src="${p.images[0]}" alt="${p.name}" onerror="this.style.display='none'">`
                            : `<div style="height:180px; background:rgba(0,0,0,0.2); border-radius:8px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.2);"><i class="fa-regular fa-image" style="font-size:2rem;"></i></div>`
                        }
                    </div>
                    <div class="brand">${p.brand}</div>
                    <div class="name">${p.name} ${p.size ? '· ' + p.size : ''}</div>
                    <div class="price">Rs ${Number(p.price).toLocaleString()}</div>
                    <div class="stock ${p.in_stock ? 'in-stock' : 'out-of-stock'}">${p.in_stock ? 'In Stock' : 'Out of Stock'}</div>
                    ${p.promo ? `<div style="color:#fbbf24; font-size:0.75rem;">${p.promo}</div>` : ''}
                    <div class="card-actions">
                        <button class="btn-secondary" onclick="window.openEditModal('${p.id}')"><i class="fa-regular fa-pen-to-square"></i> Edit</button>
                        <button class="btn-danger" onclick="window.deleteProduct('${p.id}')"><i class="fa-regular fa-trash-can"></i> Delete</button>
                    </div>
                </div>
            `).join('');
        };

        window.openEditModal = function(id) {
            supabase
                .from(TABLE_NAME)
                .select('*')
                .eq('id', id)
                .single()
                .then(({ data, error }) => {
                    if (error) {
                        window.showToast('Error loading product');
                        return;
                    }
                    if (!data) return;

                    document.getElementById('modalTitle').textContent = 'Edit Product';
                    document.getElementById('editId').value = data.id;
                    document.getElementById('brand').value = data.brand || '';
                    document.getElementById('name').value = data.name || '';
                    document.getElementById('size').value = data.size || '';
                    document.getElementById('price').value = data.price || '';
                    document.getElementById('description').value = data.description || '';
                    document.getElementById('inStock').value = data.in_stock ? 'true' : 'false';
                    document.getElementById('promo').value = data.promo || '';
                    document.getElementById('shades').value = data.shades || '';

                    currentImages = data.images || [];
                    const preview = document.getElementById('imagePreviewContainer');
                    preview.innerHTML = currentImages.map((url) => `
                        <img src="${url}" alt="product image" />
                    `).join('');

                    document.getElementById('productModal').classList.add('open');
                });
        };

        window.deleteProduct = async function(id) {
            if (!confirm('Delete this product permanently?')) return;

            const { error } = await supabase
                .from(TABLE_NAME)
                .delete()
                .eq('id', id);

            if (error) {
                window.showToast('Error deleting product');
                return;
            }

            window.showToast('Product deleted');
            window.fetchProducts();
        };

        // =============================================================
        // IMAGE UPLOAD
        // =============================================================
        window.handleFileSelect = async function(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const preview = document.getElementById('imagePreviewContainer');

            for (const file of files) {
                // Show temporary thumbnail
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.style.opacity = '0.6';
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);

                // Upload to Supabase Storage
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}-${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
                const filePath = fileName;

                const { data, error } = await supabase.storage
                    .from(BUCKET_NAME)
                    .upload(filePath, file);

                if (error) {
                    console.error('Upload error:', error);
                    window.showToast(`Failed to upload ${file.name}`);
                    continue;
                }

                // Get public URL
                const { data: urlData } = supabase.storage
                    .from(BUCKET_NAME)
                    .getPublicUrl(filePath);

                const publicUrl = urlData.publicUrl;
                currentImages.push(publicUrl);

                // Update thumbnail to full image
                const thumbs = preview.querySelectorAll('img');
                const lastThumb = thumbs[thumbs.length - 1];
                if (lastThumb) {
                    lastThumb.src = publicUrl;
                    lastThumb.style.opacity = '1';
                }
            }

            document.getElementById('fileInput').value = '';
        };

        // =============================================================
        // SAVE PRODUCT
        // =============================================================
        window.saveProduct = async function(event) {
            event.preventDefault();

            const id = document.getElementById('editId').value;
            const brand = document.getElementById('brand').value.trim();
            const name = document.getElementById('name').value.trim();
            const size = document.getElementById('size').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const description = document.getElementById('description').value.trim();
            const inStock = document.getElementById('inStock').value === 'true';
            const promo = document.getElementById('promo').value.trim();
            const shades = document.getElementById('shades').value.trim();

            if (!brand || !name || isNaN(price)) {
                window.showToast('Please fill in all required fields.');
                return;
            }

            const productData = {
                brand,
                name,
                size: size || null,
                price,
                description: description || null,
                in_stock: inStock,
                promo: promo || null,
                shades: shades || null,
                images: currentImages,
                updated_at: new Date().toISOString()
            };

            let result;
            if (id) {
                result = await supabase
                    .from(TABLE_NAME)
                    .update(productData)
                    .eq('id', id);
            } else {
                result = await supabase
                    .from(TABLE_NAME)
                    .insert([productData]);
            }

            if (result.error) {
                console.error(result.error);
                window.showToast('Error saving product');
                return;
            }

            window.showToast(id ? 'Product updated!' : 'Product added!');
            window.closeModal();
            window.fetchProducts();
        };

        // =============================================================
        // TOAST
        // =============================================================
        window.showToast = function(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        };

        // =============================================================
        // EVENT BINDINGS (using IDs instead of inline onclick)
        // =============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Attach click events to buttons
            document.getElementById('addProductBtn').addEventListener('click', window.openAddModal);
            document.getElementById('refreshBtn').addEventListener('click', window.fetchProducts);

            // Close modal when clicking outside
            document.getElementById('productModal').addEventListener('click', function(e) {
                if (e.target === this) window.closeModal();
            });

            // Load products
            window.fetchProducts();

            console.log('Dashboard ready.');
        });
    </script>
</body>
</html>
